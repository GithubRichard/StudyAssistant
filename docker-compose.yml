# Linux 部署：应用容器使用宿主网络，便于直接访问宿主机上的 Hermes API（默认 127.0.0.1:8642）。
#
# 监听地址由 APP_HOST 决定（compose 会读取 .env 同目录的变量）：
#   APP_HOST=127.0.0.1（默认，安全）→ 仅本机可达，公网入口交给 HTTPS 反向代理
#   APP_HOST=0.0.0.0（调试用）     → 可直接用 http://服务器IP:8000 访问
#                                      必须同时在云防火墙限制来源 IP，且务必配好 WECHAT_SECRET，
#                                      否则任何人伪造 code 即可登录并消耗额度
# 注意：host 网络模式仅适用于 Linux 主机；macOS 本地验证请直接用 Python 运行（见 README）。
services:
  grader:
    build: .
    network_mode: host
    environment:
      CONFIG_PATH: /srv/app/config.yaml
      APP_HOST: "${APP_HOST:-127.0.0.1}"
      APP_PORT: "${APP_PORT:-8000}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"                  # 业务日志级别：DEBUG/INFO/WARNING
      SA_DEBUG_THINKING: "${SA_DEBUG_THINKING:-0}"    # 临时记录模型思考过程：1=开，0=关
    env_file:
      - .env
    volumes:
      - ./data:/srv/app/data                       # 数据库、上传图片、任务输出
      - ./workspace:/srv/app/workspace             # 授权学习工作区（记录 + 归档）
      - ./config.yaml:/srv/app/config.yaml:ro      # 配置文件（先 cp config.example.yaml config.yaml）
    restart: unless-stopped
