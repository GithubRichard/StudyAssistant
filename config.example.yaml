# Leo 学习任务服务配置模板
# 用法：cp config.example.yaml config.yaml，再按需修改
# 密钥不写在这里，写在 .env 中，用 ${VAR} 引用

server:
  # 只监听本机，由 HTTPS 反向代理对外（Linux 上用宿主网络模式时保持 127.0.0.1）
  host: "127.0.0.1"
  port: 8000

# ================= 执行引擎 =================
# hermes：由 Hermes Agent 执行学习技能（默认，推荐）
# legacy：旧的多模型直连单轮批改（结果会明确标注未执行技能流程与二次核查）
engine:
  mode: "hermes"

hermes:
  base_url: "${HERMES_BASE_URL:-http://127.0.0.1:8642}"
  api_key: "${HERMES_API_KEY}"
  agent_model: "hermes-agent"          # Hermes 的 Agent 别名，不是底层模型 ID
  skill_name: "leo-study-assistant"    # 用于 /v1/skills 就绪校验
  timeout_seconds: 900                 # 单轮执行上限（秒）；Agent 多轮工具调用较慢，别设太小
  max_response_bytes: 2000000          # 响应体上限，防止超大输出
  verify_skill: true                   # 启动时校验技能是否已安装

# ================= 访问授权（家庭私用）=================
auth:
  # 留空表示不限制账号（仅适合本地开发）。上线前填入允许使用的微信 openid。
  allowed_openids: []
  session_ttl_days: 30

# ================= 授权学习工作区 =================
workspace:
  dir: "workspace"        # 学习记录目录
  # 说明：本服务不修改工作区历史，归档由服务端校验路径后执行；
  # 若要 Hermes 也拿不到写权限，请在部署时为它挂载只读卷（本开关仅作声明，不由代码强制执行）
  readonly: true
  init_readme: true       # 工作区为空时用技能内置规范初始化 README（不覆盖已有内容）

# ================= 任务与资源上限 =================
limits:
  max_assets_per_task: 20
  max_total_upload_mb: 40
  max_runs_per_task: 6
  max_task_minutes: 30
  claim_lease_seconds: 600
  worker_poll_seconds: 2.0
  worker_enabled: true

# ================= 外部交付开关（默认全关）=================
# 未启用时结果中如实标注 not_configured，不会因为模型自述而变成成功
delivery:
  pdf_enabled: false
  email_enabled: false
  git_enabled: false

# ================= 受控 Git 提交推送（学习记录同步）=================
# 开启后：归档成功 → 只提交本次授权的工作区学习记录 → 推送。
# 禁止全量暂存、禁止 git add -f 绕过原题忽略规则、禁止 force push / 硬重置 / 改配置 / 跳过钩子；
# 遇内容冲突或分支分歧时在仓库根生成「冲突记录-YYYY-MM-DD-HHmmss.md」并停止上传。
# enabled 留空（不写）时回落到上面的 delivery.git_enabled。
git:
  # enabled: true
  remote: "origin"          # 期望的远端名，需与实际 upstream 一致
  timeout_seconds: 60
  author_name: ""           # 留空则沿用仓库已有的 git user.name / user.email
  author_email: ""

# ================= 家庭学习配置默认值 =================
# 小程序「设置」页保存后的值会覆盖这里的默认值；未保存时以此为准。
# 学科清单同时决定工作区要创建哪些「学科/{错题解析,周报分析,强化训练} + 原题」目录骨架。
family:
  default_grade_level: ""   # 留空表示未指定，不擅自假设年级
  subjects: ["语文", "数学", "英语"]
  term_start_date: ""       # 本学期开学日期 YYYY-MM-DD，用于期中考/期末考默认区间；留空时如实说明缺口

# ================= 配额与费用 =================
quota:
  new_user_bonus: 20
  daily_free: 3
  max_per_day: 50
budget:
  daily_max_cny: 50.0

# ================= 微信（正式环境必填）=================
wechat:
  appid: "${WECHAT_APPID}"
  secret: "${WECHAT_SECRET}"
  seccheck_enabled: false
  subscribe_template_id: "${WECHAT_TEMPLATE_ID}"

# ================= 网页版（IP 直连，免小程序备案）=================
# 浏览器访问 http://<服务器IP>:<端口>/ 即可使用；与小程序共用同一套接口与学习记录。
# 网页版 v1：账号白名单登录。一个账号 = 一个孩子，学习记录按账号隔离。
# 用 scripts/make_web_user.py 生成账号片段（密码只存 pbkdf2 哈希，不存明文），粘贴到下面。
web:
  enabled: true
  title: "学习助手"
  users:
    # - username: "kid1"
    #   display_name: "老大"
    #   password_hash: "pbkdf2_sha256$260000$<salt_hex>$<hash_hex>"
  allowed_origins: []         # 前后端分离部署时填来源域名；同源部署留空更安全

# ================= 图片处理 =================
data_dir: "data"
# 错题台账按账号保留天数（默认 2 年）；超期错题及关联订正/复测事件由每日定时任务自动清理。
# 任务、附件、GitHub 归档不受影响。
retention_days: 730
max_image_mb: 5
max_image_px: 1600

# ================= legacy 引擎（engine.mode=legacy 时生效）=================
# Hermes 模式下这里保持全关；底层模型由 Hermes 自己配置，密钥不下发到本服务。
llm:
  default_provider: "qwen"
  fallback_order: []
  providers:
    qwen:
      type: "openai_compatible"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api_key: "${QWEN_API_KEY}"
      model: "qwen-vl-max"
      enabled: false
    glm:
      type: "openai_compatible"
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      api_key: "${GLM_API_KEY}"
      model: "glm-4v-flash"
      enabled: false
grade_concurrency: 2
system_prompt_file: "prompt_system.txt"
user_prompt_template: "请批改这张{subject}作业照片（{grade_level}）。严格按系统指令要求的 JSON 格式输出。"
